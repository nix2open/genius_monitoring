name: Latency Monitor


on:
  schedule:
    - cron: '*/30 * * * *'  # каждые 30 минут
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Measure latency 3 times
        id: latency
        env:
          URL: 'https://ad.new-programmatic.com/services/nslookup?require-debug-info=body&tid=3835'
        run: |
          echo "Measuring latency and status for $URL (3 attempts, timeout 15s each)"

          measure_once() {
            local out
            out=$(curl -s -o /dev/null --max-time 15 -w "%{time_total} %{http_code}" "$URL" 2>/dev/null || echo "15.000 000")
            echo "$out"
          }

          read T1 C1 <<<"$(measure_once)"
          LAT1=$(echo "$T1" | awk '{print int($1*1000)}')
          echo "Try #1: ${LAT1} ms, code ${C1}"

          read T2 C2 <<<"$(measure_once)"
          LAT2=$(echo "$T2" | awk '{print int($1*1000)}')
          echo "Try #2: ${LAT2} ms, code ${C2}"

          read T3 C3 <<<"$(measure_once)"
          LAT3=$(echo "$T3" | awk '{print int($1*1000)}')
          echo "Try #3: ${LAT3} ms, code ${C3}"

          SUM=$((LAT1 + LAT2 + LAT3))
          AVG_MS=$((SUM / 3))

          echo "Average latency: ${AVG_MS} ms"

          {
            echo "lat1=${LAT1}"
            echo "lat2=${LAT2}"
            echo "lat3=${LAT3}"
            echo "code1=${C1}"
            echo "code2=${C2}"
            echo "code3=${C3}"
            echo "avg_ms=${AVG_MS}"
          } >> "$GITHUB_OUTPUT"

      - name: Check conditions for alerts
        id: check_alerts
        env:
          URL: 'https://ad.new-programmatic.com/services/nslookup?require-debug-info=body&tid=3835'
        run: |
          LAT1=${{ steps.latency.outputs.lat1 }}
          LAT2=${{ steps.latency.outputs.lat2 }}
          LAT3=${{ steps.latency.outputs.lat3 }}
          AVG=${{ steps.latency.outputs.avg_ms }}
          CODE1=${{ steps.latency.outputs.code1 }}
          CODE2=${{ steps.latency.outputs.code2 }}
          CODE3=${{ steps.latency.outputs.code3 }}

          echo "Checking conditions..."
          echo "avg_ms=${AVG}, codes=${CODE1},${CODE2},${CODE3}"

          ALERT_REASON=""

          if [ "$AVG" -gt 10000 ]; then
            ALERT_REASON="Высокое среднее время ответа (>10s)."
          fi

          if [ "$CODE1" -ge 500 ] && [ "$CODE2" -ge 500 ] && [ "$CODE3" -ge 500 ]; then
            if [ -n "$ALERT_REASON" ]; then
              ALERT_REASON="${ALERT_REASON} Сервис выдает ошибку (HTTP 5xx)."
            else
              ALERT_REASON="Сервис выдает ошибку (HTTP 5xx)."
            fi
          fi

          if [ -z "$ALERT_REASON" ]; then
            echo "✅ OK, no alert."
            echo "should_alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Alert needed: $ALERT_REASON"
            MSG="🚨 Latency Alert!\n"
            MSG+="URL: ${URL}\n"
            MSG+="Среднее время ответа: ${AVG} ms (> 10000 ms)\n"
            MSG+="Замеры:\n"
            MSG+="1) ${LAT1} ms, код ${CODE1}\n"
            MSG+="2) ${LAT2} ms, код ${CODE2}\n"
            MSG+="3) ${LAT3} ms, код ${CODE3}"
            MSG_ESCAPED=$(printf '%s' "$MSG" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            echo "message=${MSG_ESCAPED}" >> "$GITHUB_OUTPUT"
            echo "should_alert=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram alert
        if: ${{ steps.check_alerts.outputs.should_alert == 'true' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG_ESCAPED="${{ steps.check_alerts.outputs.message }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": ${MSG_ESCAPED}}"

      - name: Send VK alert
        if: ${{ steps.check_alerts.outputs.should_alert == 'true' }}
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_PEER_ID: 2000000001  
        run: |
          MSG_ESCAPED="${{ steps.check_alerts.outputs.message }}"
          RANDOM_ID=$(date +%s%3N)

          response=$(curl -s -X POST "https://api.vk.com/method/messages.send" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d "peer_id=${VK_PEER_ID}&message=${MSG_ESCAPED}&access_token=${VK_TOKEN}&v=5.131&random_id=${RANDOM_ID}")

          echo "VK API response: $response"

          if echo "$response" | grep -q '"error"'; then
            echo "❌ VK alert failed: $response"
            exit 1
          else
            echo "✅ VK alert sent successfully"
          fi
